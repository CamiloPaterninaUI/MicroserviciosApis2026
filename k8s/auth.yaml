# =============================================================================
# auth-service - delega registro/login en Keycloak (emisor unico JWT).
# No tiene PostgreSQL propia; la identidad vive en Keycloak.
# =============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: proyecto-03
  labels:
    app: auth-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: tienda-deportiva/auth-service:3.0.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8081
          env:
            - name: KEYCLOAK_SERVER_URL
              value: http://keycloak:8080
            - name: KEYCLOAK_REALM
              value: tienda-deportiva
            - name: KEYCLOAK_CLIENT_ID
              value: tienda-auth
            - name: KEYCLOAK_ADMIN_USER
              value: admin
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tienda-secrets
                  key: keycloak-admin-password
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
      restartPolicy: Always

---

apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: proyecto-03
  labels:
    app: auth-service
spec:
  type: ClusterIP
  selector:
    app: auth-service
  ports:
    - name: http
      port: 8081
      targetPort: 8081
