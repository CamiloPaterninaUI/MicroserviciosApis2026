# =============================================================================
# producto-service - PostgreSQL propia (productos_db) + REST y SOAP
# =============================================================================

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: productos-postgres-pvc
  namespace: proyecto-03
  labels:
    app: productos-postgres
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: hostpath
  resources:
    requests:
      storage: 2Gi

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: productos-postgres
  namespace: proyecto-03
  labels:
    app: productos-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: productos-postgres
  template:
    metadata:
      labels:
        app: productos-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          env:
            - name: POSTGRES_DB
              value: productos_db
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: tienda-secrets
                  key: productos-db-username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tienda-secrets
                  key: productos-db-password
          ports:
            - containerPort: 5432
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: productos-postgres-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d productos_db"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 15
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d productos_db"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
      volumes:
        - name: productos-postgres-data
          persistentVolumeClaim:
            claimName: productos-postgres-pvc
      restartPolicy: Always

---

apiVersion: v1
kind: Service
metadata:
  name: productos-db
  namespace: proyecto-03
  labels:
    app: productos-postgres
spec:
  type: ClusterIP
  selector:
    app: productos-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: producto-service
  namespace: proyecto-03
  labels:
    app: producto-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: producto-service
  template:
    metadata:
      labels:
        app: producto-service
    spec:
      containers:
        - name: producto-service
          image: tienda-deportiva/producto-service:3.0.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8083
          env:
            - name: PRODUCTOS_DB_URL
              value: jdbc:postgresql://productos-db:5432/productos_db
            - name: PRODUCTOS_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: tienda-secrets
                  key: productos-db-username
            - name: PRODUCTOS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tienda-secrets
                  key: productos-db-password
            - name: KEYCLOAK_ISSUER_URI
              value: http://keycloak:8080/realms/tienda-deportiva
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
      restartPolicy: Always

---

apiVersion: v1
kind: Service
metadata:
  name: producto-service
  namespace: proyecto-03
  labels:
    app: producto-service
spec:
  type: ClusterIP
  selector:
    app: producto-service
  ports:
    - name: http
      port: 8083
      targetPort: 8083
