# =============================================================================
# api-gateway - punto de entrada unico (Spring Cloud Gateway).
# Enrutamiento interno por DNS de Kubernetes (nunca localhost entre pods).
# =============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: proyecto-03
  labels:
    app: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: tienda-deportiva/api-gateway:3.0.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: AUTH_SERVICE_URL
              value: http://auth-service:8081
            - name: USER_SERVICE_URL
              value: http://user-service:8082
            - name: PRODUCTO_SERVICE_URL
              value: http://producto-service:8083
            - name: PEDIDO_SERVICE_URL
              value: http://pedido-service:8084
            - name: PAGO_SERVICE_URL
              value: http://pago-service:8085
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
      restartPolicy: Always

---

apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: proyecto-03
  labels:
    app: api-gateway
spec:
  type: ClusterIP
  selector:
    app: api-gateway
  ports:
    - name: http
      port: 8080
      targetPort: 8080
