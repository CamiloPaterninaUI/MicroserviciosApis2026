server:
  port: 8081

spring:
  application:
    name: auth-service
  jackson:
    default-property-inclusion: non_null

# Conexión con Keycloak: único emisor de identidades (OIDC / OAuth 2.0).
# En Kubernetes se inyectan KEYCLOAK_* apuntando al DNS interno del servicio keycloak.
keycloak:
  server-url: ${KEYCLOAK_SERVER_URL:http://localhost:8080}
  realm: ${KEYCLOAK_REALM:tienda-deportiva}
  client-id: ${KEYCLOAK_CLIENT_ID:tienda-auth}
  client-secret: ${KEYCLOAK_CLIENT_SECRET:}
  admin-client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:tienda-admin}
  admin-client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
