server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/auth/**
            - id: user-service
              uri: ${USER_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/users/**
            - id: producto-service
              uri: ${PRODUCTO_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/productos/**
            - id: pedido-service
              uri: ${PEDIDO_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/pedidos/**
            # SOAP de la tienda (ProductoEndpoint) y su WSDL, enrutados tambien
            # por el punto de entrada unico.
            - id: producto-service-soap
              uri: ${PRODUCTO_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/ws/**
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins: "*"
                allowedMethods: "*"
                allowedHeaders: "*"

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      probes:
        enabled: true
