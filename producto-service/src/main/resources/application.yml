server:
  port: 8083

spring:
  application:
    name: producto-service
  datasource:
    url: ${PRODUCTOS_DB_URL:jdbc:postgresql://localhost:5435/productos_db}
    username: ${PRODUCTOS_DB_USERNAME:postgres}
    password: ${PRODUCTOS_DB_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null

app:
  jwt:
    public-key: classpath:keys/public.pem

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
