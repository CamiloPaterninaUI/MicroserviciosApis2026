server:
  port: 8082

spring:
  application:
    name: user-service
  datasource:
    url: ${USER_DB_URL:jdbc:postgresql://localhost:5434/users_db}
    username: ${USER_DB_USERNAME:postgres}
    password: ${USER_DB_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null
  # Identidad: OAuth 2.0 / OpenID Connect con Keycloak (emisor unico JWT).
  # En Kubernetes se inyecta KEYCLOAK_ISSUER_URI=http://keycloak:8080/realms/tienda-deportiva
  # (DNS interno de k8s, nunca localhost entre pods).
  security:
    oauth2:
      resourceserver:
        oidc:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/tienda-deportiva}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
